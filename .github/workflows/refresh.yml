name: Refresh NFL data
on:
  schedule:
    # GitHub cron runs in UTC. 7am Central = 12:00 UTC (CDT) or 13:00 UTC (CST);
    # run at both and let the guard below keep only the one that lands at 7am Chicago time.
    - cron: "5 12 * * *"
    - cron: "5 13 * * *"
    # Pregame handle reads ~1 hour before kickoff windows (the guard keeps only the matching Chicago times)
    - cron: "15 * * * 0,1,2,4,5"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Also backfill opening/closing lines for played games (The Odds API paid plan)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Only run at 7am Central or a pregame window
        id: guard
        run: |
          H=$(TZ=America/Chicago date +%H); DH=$(TZ=America/Chicago date +%a-%H)
          SCHED="${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$H" = "07" ] && [ "${SCHED#5 }" != "$SCHED" ]; }; then echo "go=1" >> $GITHUB_OUTPUT; echo "periods=1" >> $GITHUB_OUTPUT
          elif [ "${SCHED#15 }" != "$SCHED" ]; then
            case "$DH" in
              Thu-18|Sun-11|Sun-14|Sun-18|Mon-18) echo "go=1" >> $GITHUB_OUTPUT; echo "periods=0" >> $GITHUB_OUTPUT; echo "Pregame read $DH" ;;
              *) echo "Chicago $DH, skipping" ;;
            esac
          else echo "Chicago $DH, skipping"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.go == '1'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.go == '1'
        with: { python-version: "3.12" }
      - run: pip install pandas pyarrow
        if: steps.guard.outputs.go == '1'
      - name: Download nflverse data
        if: steps.guard.outputs.go == '1'
        run: |
          mkdir -p raw
          curl -sSfL -o raw/games.csv https://github.com/nflverse/nflverse-data/releases/download/schedules/games.csv
          curl -sSfL -o raw/pbp_2026.parquet https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_2026.parquet
          curl -sSfL -o raw/pbp_2025.parquet https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_2025.parquet
          curl -sSfL -o raw/pbp_2024.parquet https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_2024.parquet
      - name: Pull sportsbook lines (skips if no ODDS_API_KEY secret)
        if: steps.guard.outputs.go == '1'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_PERIOD_LINES: ${{ steps.guard.outputs.periods }}
        run: |
          python odds.py daily raw data || echo "odds pull failed, continuing"
          if [ "${{ inputs.backfill }}" = "true" ]; then python odds.py backfill raw data || echo "backfill failed, continuing"; fi
      - name: Pull DraftKings and Circa betting splits (skips if no SHARPAPI_KEY secret)
        if: steps.guard.outputs.go == '1'
        env:
          SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY }}
        run: python splits.py raw data || echo "splits pull failed, continuing"
      - name: Scan NFL.com / NFL Network and ESPN coverage for the total (Check 9)
        if: steps.guard.outputs.go == '1'
        timeout-minutes: 4
        continue-on-error: true
        run: python news.py raw data || echo "news scan failed, continuing"
      - run: python model.py raw data
        if: steps.guard.outputs.go == '1'
      - name: Commit updated data
        if: steps.guard.outputs.go == '1'
        run: |
          git config user.name "nfl-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Refresh data $(date -u +%F)" && git push)
